baseurl      = "https://RollingOat.github.io/4d_orchard_mapping_website/"
title        = "4D Metric-Semantic Mapping for Persistant Orchard Monitoring: Method and Dataset"
languageCode = "en-us"
theme        = "hello-friend-ng"
paginate     = 10

[params]
  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Enable sharing buttons, if you like
  enableSharingButtons = true
  
  # Show a global language switcher in the navigation bar
  enableGlobalLanguageMenu = true

[taxonomies]
    category = "blog"
    tag      = "tags"
    series   = "series"

[markup.goldmark.renderer]
    unsafe= true
    
[languages]
  [languages.en.params]
    title = "4D METRIC SEMANTIC MAPPING"
    keywords = ""
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

    [languages.en.params.logo]
      logoText = "4D METRIC SEMANTIC MAPPING FOR ORCHARDS"
      # logoHomeLink intentionally unset: the theme then derives the home link
      # from baseURL, which keeps it correct under the /<repo>/ Pages subpath.
      # Hardcoding "/" would link to RollingOat.github.io root instead.

# And you can even create generic menu
[menus]
  [[menus.main]]
    name = 'Overview'
    pageRef = '/overview'
    weight = 20
  [[menus.main]]
    name = 'Data'
    pageRef = '/data'
    weight = 20
  [[menus.main]]
    name = 'Downloads'
    url = 'https://tnl.treescope.org/4dMetricSemantic/'
    weight = 30